name: CI Dev K8s

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"

permissions: {}

env:
  REGISTRY: registry.dev.k8s-dev.org
  REPOSITORY: team-webexp
  APP: lido-content
  REGISTRY_USER: robot$team-webexp-rw

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build and push to Harbor
    permissions:
      contents: read # to check out the repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Harbor
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Build and push app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.APP }}:dev
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.APP }}:${{ github.sha }}
          builder: ${{ steps.buildx.outputs.name }}
